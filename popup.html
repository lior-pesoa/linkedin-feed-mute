<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1d2226;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      form {
        display: flex;
        gap: 6px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid #b8bcc0;
        border-radius: 6px;
        font: inherit;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      form button {
        padding: 6px 12px;
        border: 0;
        border-radius: 6px;
        background: #0a66c2;
        color: #fff;
      }
      ul {
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 5px 0;
        border-top: 1px solid #e8e8e8;
      }
      li span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      li button {
        border: 0;
        background: none;
        color: #666;
        font-size: 16px;
        line-height: 1;
        padding: 2px 6px;
      }
      li button:hover {
        color: #c00;
      }
      #empty {
        margin: 10px 0 0;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Mute posts mentioning</h1>
    <form id="add-form">
      <input id="new-keyword" placeholder="Add a keyword" autofocus />
      <button type="submit">Add</button>
    </form>
    <ul id="keywords"></ul>
    <p id="empty" hidden>No keywords yet, so nothing is hidden.</p>
    <script src="popup.js"></script>
  </body>
</html>
